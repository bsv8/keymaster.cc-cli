<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>km 管理</title>
<style>
  :root { color-scheme: light dark; --muted:#888; --line:#8884; }
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; }
  h1 { font-size: 1.3rem; } .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
  input, button { padding: .35rem .6rem; font: inherit; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: .35rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .85rem; color: var(--muted); font-weight: 600; }
  .muted { color: var(--muted); } code { font-size: .85rem; }
  .error { color: #c0392b; }
  [hidden] { display: none !important; }
  #loginBox { margin: 4rem auto; max-width: 26rem; padding: 1.2rem; border: 1px solid var(--line); border-radius: .5rem; }
  #loginBox input { width: 100%; box-sizing: border-box; margin: .6rem 0; }
</style>
</head>
<body>
<div id="loginView">
  <div id="loginBox">
    <h1>km 管理</h1>
    <p class="muted">请输入 API Key（当前配置文件的 admin.apiKey），正确后进入管理页。</p>
    <form id="loginForm">
      <input id="key" type="password" autocomplete="off" placeholder="API Key">
      <div class="row"><button id="login" type="submit">登录</button></div>
    </form>
    <p id="loginError" class="error"></p>
  </div>
</div>
<div id="adminView" hidden>
  <h1>km 管理 <span class="muted" id="network"></span></h1>
  <div class="row">
    <span class="muted">API Key 已验证（仅本标签页有效）</span>
    <button id="lock" type="button">锁定</button>
    <button id="refreshFiles" type="button">刷新目录与索引</button>
    <button id="reindexFiles" type="button">强制重新索引</button>
    <span id="hint" class="muted"></span>
  </div>
  <pre id="status" class="muted">未连接</pre>
  <div class="row">
    <label>缺省</label>
    <input id="defaultSeedPrice" placeholder="Seed 缺省 (sats)" size="14">
    <input id="defaultBlockPrice" placeholder="完整块缺省 (sats)" size="14">
    <button id="saveDefaults">保存缺省</button>
    <span class="muted">已有独立定价的文件不受影响；保存后写入 config.json，重启保持</span>
  </div>
  <div class="row">
    <label>批量</label>
    <select id="mode"><option value="unpriced">仅未定价</option><option value="all">覆盖全部</option></select>
    <input id="batchPath" placeholder="目录（可选，空=全部）" size="16">
    <input id="seedPrice" placeholder="Seed 价格 (sats)" size="14">
    <input id="blockPrice" placeholder="完整块价格 (sats)" size="14">
    <button id="batch">应用</button>
  </div>
  <table>
    <thead><tr><th>文件</th><th>大小</th><th>Seed / 块价</th><th>来源</th><th></th></tr></thead>
    <tbody id="files"><tr><td colspan="5" class="muted">加载中</td></tr></tbody>
  </table>
</div>
<script>
const $ = id => document.getElementById(id);
let key = sessionStorage.getItem('km-admin-key') || '';
$('key').value = key;
const headers = () => ({'content-type':'application/json', 'authorization':'Bearer ' + key});
async function call(path, options = {}) {
  const response = await fetch(path, { ...options, headers: headers() });
  if (!response.ok) throw new Error(response.status + ' ' + (await response.text()).slice(0, 200));
  return response.json();
}
function showLogin(message) {
  $('adminView').hidden = true;
  $('loginView').hidden = false;
  $('loginError').textContent = message || '';
}
function showAdmin() {
  $('loginView').hidden = true;
  $('adminView').hidden = false;
}
async function refresh() {
  const status = await call('/api/status');
  $('network').textContent = '(' + status.network + ')';
  $('defaultSeedPrice').value = status.seedPrice;
  $('defaultBlockPrice').value = status.blockPrice;
  $('status').textContent = JSON.stringify(status, null, 2);
  const { files } = await call('/api/files');
  $('files').innerHTML = files.map(file => `
    <tr>
      <td><code>${escapeHtml(file.path)}</code><div class="muted">${escapeHtml(file.seedHash)}</div><div>${escapeHtml(({ready:'可供应',unindexed:'尚未索引',failed:'索引失败'})[file.state] || file.state)} ${escapeHtml(file.error || '')}</div></td>
      <td>${file.size === null ? '大小未知' : file.size + ' B'}<div class="muted">${file.blocks === null ? '块数待索引' : file.blocks + ' 块'}</div></td>
      <td>${file.seedPrice} / ${file.blockPrice}</td>
      <td class="muted">${file.override ? '独立定价' : '缺省'}</td>
      <td class="row">
        <button data-edit="${escapeHtml(file.path)}">改价</button>
        <button data-clear="${escapeHtml(file.path)}">恢复缺省</button>
      </td>
    </tr>`).join('');
}
function escapeHtml(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showError(error) { $('hint').textContent = String(error.message || error); }
// enter verifies the candidate key against /api/status: only success enters.
async function enter(candidate) {
  key = candidate;
  try {
    await refresh();
  } catch (error) {
    key = sessionStorage.getItem('km-admin-key') || '';
    throw error;
  }
  sessionStorage.setItem('km-admin-key', key);
  showAdmin();
}
$('loginForm').onsubmit = async event => {
  event.preventDefault();
  $('loginError').textContent = '';
  try {
    await enter($('key').value.trim());
  } catch (error) {
    showLogin('API Key 不正确（' + (error.message || error) + '）');
  }
};
$('lock').onclick = () => {
  sessionStorage.removeItem('km-admin-key');
  key = '';
  $('key').value = '';
  showLogin('');
};
$('saveDefaults').onclick = async () => {
  try {
    await call('/api/pricing/defaults', { method:'PUT', body: JSON.stringify({ seedPrice: $('defaultSeedPrice').value.trim(), blockPrice: $('defaultBlockPrice').value.trim() }) });
    await refresh();
  } catch (error) { showError(error); }
};
// 普通刷新不重算同路径同长度内容；强制操作明确征求操作者确认。
async function refreshCatalog(force) {
  if (force && !confirm('将完整读取所有文件并重新计算内容哈希，确认继续？')) return;
  $('hint').textContent = '正在核对目录…';
  try {
    const result = await call('/api/catalog/refresh', {method:'POST', body:JSON.stringify({force})});
    await refresh();
    $('hint').textContent = `新计算 ${result.indexed}，复用 ${result.reused}，移除 ${result.removed}，失败 ${result.failures.length}`;
  } catch (error) { showError(error); }
}
$('refreshFiles').onclick = () => refreshCatalog(false);
$('reindexFiles').onclick = () => refreshCatalog(true);
$('batch').onclick = async () => {
  try {
    await call('/api/pricing/batch', { method:'POST', body: JSON.stringify({ mode: $('mode').value, path: $('batchPath').value.trim(), seedPrice: $('seedPrice').value.trim(), blockPrice: $('blockPrice').value.trim() }) });
    await refresh();
    $('mode').textContent = '已应用';
    setTimeout(() => { $('mode').innerHTML = '<option value="unpriced">仅未定价</option><option value="all">覆盖全部</option>'; }, 800);
  } catch (error) { showError(error); }
};
$('files').onclick = async event => {
  const edit = event.target.dataset.edit;
  const clear = event.target.dataset.clear;
  try {
    if (edit) {
      const seedPrice = prompt('Seed 价格 (sats)'); if (seedPrice === null) return;
      const blockPrice = prompt('完整块价格 (sats)'); if (blockPrice === null) return;
      await call('/api/pricing/file', { method:'PUT', body: JSON.stringify({ path: edit, seedPrice, blockPrice }) });
    } else if (clear) {
      await call('/api/pricing/file?path=' + encodeURIComponent(clear), { method:'DELETE' });
    } else return;
    await refresh();
  } catch (error) { showError(error); }
};
// Auto-login only when the stored key still verifies; otherwise stay locked.
if (key) {
  enter(key).catch(() => {
    sessionStorage.removeItem('km-admin-key');
    key = '';
    $('key').value = '';
    showLogin('已保存的 API Key 无效，请重新登录');
  });
} else {
  showLogin('');
}
</script>
</body>
</html>
